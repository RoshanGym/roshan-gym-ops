<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roshan Gym · Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#17191b; --bg-1:#1f2224; --bg-2:#272b2e;
  --line:#383c3f; --line-strong:#4a4f53;
  --ink-0:#f3f1ea; --ink-1:#c7c4ba; --ink-2:#8c897f;
  --amber:#e5231b; --amber-dim:#4a1310; --amber-tint:#341210;
  --lime:#9fd857; --lime-tint:#22301a; --lime-ink:#c9edA0;
  --red:#ea5b4e; --red-tint:#3a201d; --red-ink:#f4a89e;
  --blue:#5aa8e8; --blue-tint:#1c2b39;
  --purple:#b18cf0; --purple-tint:#2a2338;
  --radius:10px;
  --font-d:'Oswald',sans-serif; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-0);color:var(--ink-0);font-family:var(--font-b);-webkit-font-smoothing:antialiased;}
::selection{background:var(--amber);color:#fff9f8;}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:.02em;margin:0;text-transform:uppercase;}
button{font-family:var(--font-b);cursor:pointer;}
input,select,textarea{font-family:var(--font-b);}
a{color:var(--amber);}

.shell{display:flex;min-height:100vh;}

.sidebar{
  width:236px;flex-shrink:0;background:var(--bg-1);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 20px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:#fff9f8;font-size:15px;flex-shrink:0;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-txt h1{font-size:15px;color:var(--ink-0);}
.brand-txt span{display:block;font-size:10px;color:var(--ink-2);text-transform:none;letter-spacing:0;font-family:var(--font-b);margin-top:1px;}

.nav-group{margin-bottom:18px;}
.nav-group-head{font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;}
.nav-tag{font-size:9px;background:var(--bg-2);color:var(--ink-2);padding:2px 6px;border-radius:4px;letter-spacing:.02em;}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;
  color:var(--ink-1);padding:9px 10px;border-radius:7px;font-size:13px;font-weight:500;margin-bottom:1px;
}
.nav-item:hover:not(.locked){background:var(--bg-2);color:var(--ink-0);}
.nav-item.active{background:var(--amber-tint);color:var(--amber);font-weight:600;}
.nav-item.locked{color:var(--ink-2);cursor:default;opacity:.55;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex-shrink:0;}
.nav-item.active .nav-dot{background:var(--amber);}

.main{flex:1;min-width:0;padding:24px 28px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.section-title{font-size:20px;color:var(--ink-0);}
.section-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;font-family:var(--font-b);text-transform:none;letter-spacing:0;}

.role-switch{display:flex;gap:2px;background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:3px;}
.role-btn{background:transparent;border:none;color:var(--ink-2);padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.role-btn.active{background:var(--amber);color:#fff9f8;}
.role-btn:not(.active):hover{color:var(--ink-0);}

.user-chip{display:flex;align-items:center;gap:10px;background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px;}
.user-chip .av{width:26px;height:26px;border-radius:50%;background:var(--amber-tint);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.user-chip .nm{font-size:12.5px;font-weight:600;color:var(--ink-0);}
.user-chip .rl{font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;}

.signin-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;}
.signin-card{width:100%;max-width:440px;background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:30px 30px 26px;}
.signin-role-group{margin-bottom:16px;}
.signin-role-label{font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.signin-person{width:100%;display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;color:var(--ink-0);font-size:13.5px;text-align:left;}
.signin-person:hover{border-color:var(--amber);}
.signin-person .av{width:28px;height:28px;border-radius:50%;background:var(--amber-tint);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.metric{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.metric .num{font-family:var(--font-d);font-size:24px;color:var(--ink-0);}
.metric .lbl{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.metric.flag .num{color:var(--red-ink);}
.metric.good .num{color:var(--lime-ink);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:14px;color:var(--ink-1);}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.toolbar select,.toolbar input{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;color:var(--ink-0);padding:8px 10px;font-size:12.5px;}

.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.row-card{cursor:pointer;transition:border-color .12s;}
.row-card:hover{border-color:var(--line-strong);}
.req-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.req-id{font-family:var(--font-m);font-size:11px;color:var(--ink-2);}
.req-title{font-size:14.5px;font-weight:600;color:var(--ink-0);margin-top:2px;}
.req-sub{font-size:12px;color:var(--ink-2);margin-top:3px;}
.req-amount{font-family:var(--font-m);font-size:16px;color:var(--ink-0);text-align:right;}
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.badge.po{background:var(--blue-tint);color:var(--blue);}
.badge.pc{background:var(--amber-tint);color:var(--amber);}
.badge.flag{background:var(--red-tint);color:var(--red-ink);margin-left:6px;}
.badge.ok{background:var(--lime-tint);color:var(--lime-ink);}
.badge.warn{background:var(--amber-tint);color:var(--amber);}
.badge.neutral{background:var(--bg-2);color:var(--ink-2);}

.stepper{display:flex;align-items:center;margin-top:14px;flex-wrap:wrap;gap:0;}
.step{display:flex;align-items:center;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex-shrink:0;}
.dot.done{background:var(--lime);}
.dot.current{background:var(--amber);box-shadow:0 0 0 3px var(--amber-tint);}
.bar{width:20px;height:2px;background:var(--line-strong);}
.bar.done{background:var(--lime);}
.step-lbl{font-size:9px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;margin-left:5px;margin-right:5px;white-space:nowrap;}
.step-lbl.current{color:var(--amber);font-weight:700;}
.step-lbl.done{color:var(--ink-1);}

.action-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn{border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--bg-2);color:var(--ink-0);text-transform:uppercase;letter-spacing:.03em;}
.btn:hover{border-color:var(--ink-2);}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#fff9f8;}
.btn.primary:hover{opacity:.9;}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red-ink);}
.btn.danger:hover{background:var(--red-tint);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:8px 4px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.sm{padding:5px 10px;font-size:11px;}

.empty{color:var(--ink-2);font-size:13px;padding:30px 0;text-align:center;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;color:var(--ink-0);padding:9px 11px;font-size:13.5px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);}
.field textarea{resize:vertical;min-height:64px;}
.hint{font-size:11px;color:var(--ink-2);margin-top:3px;}

.overlay{position:fixed;inset:0;background:rgba(10,10,10,.7);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
.modal{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:26px 28px;margin-bottom:40px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.modal-close{background:none;border:none;color:var(--ink-2);font-size:22px;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--ink-0);}

.timeline{border-left:2px solid var(--line);padding-left:16px;margin-top:6px;}
.tl-item{margin-bottom:14px;position:relative;}
.tl-item::before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--amber);}
.tl-when{font-size:10px;color:var(--ink-2);font-family:var(--font-m);}
.tl-what{font-size:13px;color:var(--ink-0);margin-top:1px;}

.file-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.file-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:9px 12px;}
.file-name{font-size:12.5px;color:var(--ink-0);}
.file-meta{font-size:10.5px;color:var(--ink-2);}

.notice{background:var(--amber-tint);border:1px solid var(--amber-dim);color:var(--ink-0);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:16px;}
.notice.err{background:var(--red-tint);border-color:#5c2620;color:var(--red-ink);}
.notice.ok{background:var(--lime-tint);border-color:#3a5222;color:var(--lime-ink);}

.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.repo-card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;}

.divider{height:1px;background:var(--line);margin:18px 0;}
.check-callout{background:var(--lime-tint);border:1px solid #3a5222;border-radius:8px;padding:12px 14px;margin-top:10px;}
.check-callout .num{font-family:var(--font-m);font-size:18px;color:var(--lime-ink);font-weight:700;}

table.simple{width:100%;border-collapse:collapse;font-size:13px;}
table.simple th{text-align:left;font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);}
table.simple td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-0);}
table.simple tr:last-child td{border-bottom:none;}
table.simple tr:hover td{background:var(--bg-2);}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-row .bl{width:110px;font-size:12px;color:var(--ink-1);flex-shrink:0;}
.bar-row .bt{flex:1;height:10px;background:var(--bg-2);border-radius:5px;overflow:hidden;}
.bar-row .bf{height:100%;background:var(--amber);border-radius:5px;}
.bar-row .bv{width:90px;text-align:right;font-family:var(--font-m);font-size:12px;color:var(--ink-1);flex-shrink:0;}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;}
.status-pill.todo{background:var(--bg-2);color:var(--ink-2);}
.status-pill.progress{background:var(--blue-tint);color:var(--blue);}
.status-pill.done{background:var(--lime-tint);color:var(--lime-ink);}

@media (max-width:900px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--line);}
  .metrics{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
